[project]
name = "Python style (throughline source)"
format_version = 3

# A throughline *source*: a standalone graph a consuming project composes via
# throughline-compose, importing it under a namespace (e.g. `py`) and referencing
# rules as `py:SR-0001`. The UIDs here are this source's own and immutable; the
# published PEP reference (e.g. "PEP 8: Naming Conventions") lives in
# `attrs.source_ref`, never in the UID.
#
# This source re-expresses PEP 8 (Style Guide for Python Code) and the docstring
# conventions of PEP 257 as a grounded IDD graph. PEP 8's major sections are
# user_requirements; each individual style rule is a system_requirement that
# implements its section.
#
# Edition handling: PEPs are living documents. A material revision is cut as a
# dated tag on this repo (e.g. v2026-08); a consumer pins the ref it wants.

[grounding]
root_types = ["intent"]
delivery_roots = ["intent"]
ground_link_types = ["derives_from", "implements"]
ai_origins = ["ai", "hybrid"]

[types.user_requirement]
attrs.source_ref = { required = true }

# PEP 8 grades no rule by level, so a system_requirement requires only its
# source reference (unlike ASVS, which requires an L1/L2/L3 level).
[types.system_requirement]
attrs.source_ref = { required = true }

[links]
types = ["derives_from", "implements", "relates"]

[link_rules]
derives_from = { from = ["user_requirement"], to = ["intent"] }
implements   = { from = ["system_requirement"], to = ["user_requirement"] }

[status]
values = ["proposed", "draft", "deferred", "approved", "ratified", "implemented",
          "verified", "suspect", "rejected", "deleted"]

[transitions]
proposed    = ["draft", "approved", "ratified", "deferred", "suspect", "rejected", "deleted"]
draft       = ["approved", "deferred", "suspect", "rejected", "deleted"]
deferred    = ["draft", "approved", "suspect", "rejected", "deleted"]
approved    = ["ratified", "implemented", "deferred", "suspect", "rejected", "deleted"]
ratified    = ["implemented", "suspect", "rejected", "deleted"]
implemented = ["verified", "suspect", "rejected", "deleted"]
verified    = ["implemented", "suspect", "deleted"]
suspect     = ["approved", "ratified", "implemented", "verified", "rejected", "deleted"]
rejected    = ["draft", "deleted"]

[docs]
paths = ["docs/*.md", "README.md"]

[status.roles]
initial = "draft"
proposed = "proposed"
ratified = "ratified"
invalidated = "rejected"
suspect = "suspect"
tombstone = "deleted"
