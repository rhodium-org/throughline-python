uid: SR-0031
type: system_requirement
status: approved
title: Put the closing triple quote of a multi-line docstring on its own line
text: >-
  For a multi-line docstring, put the closing triple quote on a line by itself; for a
  one-line docstring, keep the closing quote on the same line.
links:
- target: UR-0005
  type: implements
