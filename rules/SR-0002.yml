uid: SR-0002
type: system_requirement
status: approved
title: Indent with spaces, never mixed with tabs
text: >-
  Spaces are the preferred indentation method; never mix tabs and spaces. Python disallows
  mixing tabs and spaces for indentation.
links:
- target: UR-0001
  type: implements
attrs:
  source_ref: "PEP 8: Code Lay-out — Tabs or Spaces"
